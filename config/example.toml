node_id = "node-corp-web-01"
service_id = "bank-web"
segment = "corp"
kafka_broker = "localhost:9092"
spool_path = "/var/lib/cybercity-agent/spool"

[telemetry]
log_paths = [
    "/var/log",
]
poll_interval_secs = 5
buffer_size = 256

[policy]
allow_telemetry = true
allowed_command_kinds = ["status", "read_file"]

[[policy.host_permissions]]
kind = "read_file"
paths = ["/var/log"]

[[policy.host_permissions]]
kind = "exec_service"
units = ["nginx", "cybercity-collector"]
